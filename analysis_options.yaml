include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - lib/src/generated/**
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - prefer_final_locals
    - unawaited_futures
    - avoid_dynamic_calls
