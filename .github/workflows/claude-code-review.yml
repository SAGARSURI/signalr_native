name: Claude Code Review

# Reviews every pull request when it is opened, updated, reopened or marked ready.
# Needs one repository secret: CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` with a
# Pro/Max plan) or ANTHROPIC_API_KEY. The Claude GitHub App must be installed on the repo.
# Runs only from the default branch's copy of this file, so it starts after this is merged.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. signalr_native is a Flutter plugin that wraps the
            official SignalR clients: Java (Android, Kotlin adapter in android/) and Swift
            (iOS, adapter in ios/signalr_native/Sources). Dart API in lib/, Pigeon schema in
            pigeons/. Design decisions and known client limits are in docs/CONTEXT.md; read
            the parts relevant to the diff before judging behaviour.

            Look for, in this order:
            1. Correctness bugs: wrong results, crashes, hangs, leaks, lost or duplicated
               messages, calls that never complete.
            2. Concurrency: main-thread rules, races between start/stop/reconnect, actor
               reentrancy on iOS, callbacks delivered twice or never.
            3. Android/iOS parity: the same Dart call must behave the same on both platforms.
            4. Public API and pub.dev readiness: breaking changes, missing docs or CHANGELOG
               for user-visible changes.
            5. Tests: changed behaviour without a test.

            For each problem, give a concrete failure scenario (inputs or sequence of events
            and what goes wrong). Skip style nits unless they hide a bug. Don't repeat what
            the diff already makes obvious.

            Post specific issues as inline comments on the lines involved. Put a short summary
            in the PR comment: the verdict, then the findings ranked by severity. If you find
            nothing worth fixing, say so in one line.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
