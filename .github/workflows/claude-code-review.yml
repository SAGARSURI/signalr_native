name: Claude Code Review

# Reviews every non-draft pull request when it is opened, updated or marked ready.
# Auth: set ONE repository secret — ANTHROPIC_API_KEY (API billing) or
# CLAUDE_CODE_OAUTH_TOKEN (Claude Pro/Max, from `claude setup-token`) — and install
# the Claude GitHub App (https://github.com/apps/claude) on this repository.
# Secrets are not passed to workflows triggered from forks, so fork PRs are skipped.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing signalr_native, a Flutter plugin that wraps the official
            ASP.NET Core SignalR clients: Java on Android (android/), Swift on iOS
            (ios/signalr_native/, Swift Package Manager only), with a Dart API in lib/
            and Pigeon definitions in pigeons/. docs/CONTEXT.md records the design
            decisions (D1–D12), the server contract and known client limitations — read
            it first and judge the change against it. Production use: a trading app
            whose hubs run on Azure SignalR Service.

            Focus, in this order:
            1. Critical bugs: lifecycle and reconnect races (start/stop/dispose,
               onClosed ordering), calls or streams that can hang or leak, thread and
               actor confinement (main thread vs client actor), data loss or reordering
               on the data plane.
            2. Wrong assumptions about the Java or Swift SignalR client, Pigeon or
               Flutter platform channels. Check them against the client source when you
               can; say when a claim is unverified.
            3. Android/iOS parity: the same Dart config must behave the same on both.
            4. Performance on the hot path (per-message work, allocations, copies,
               platform-channel hops).
            5. Tests: missing coverage for the behaviour that changed.

            Skip style nits and anything generated (lib/src/generated, *.g.swift,
            Messages.g.kt). Use inline comments for specific lines, and one top-level
            summary comment that ranks findings by severity. Say plainly if you found
            nothing significant.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
